[project]
name = "agentic-k12-teaching-assistant"
version = "0.1.0"
description = "Agentic tutoring coach: photo of work in, diagnosis and targeted practice out."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "pillow>=10",
  "pillow-heif>=0.18",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov",
  "mypy>=1.10",
  "ruff>=0.5",
  "playwright>=1.45",
  "pytest-playwright>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom requires calling Depends()/File()/Form() in
# argument defaults; B008 otherwise flags exactly the pattern FastAPI's own docs use.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]

[tool.mypy]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "pillow_heif"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not browser'"
markers = [
  "browser: end-to-end tests driving a real Chromium via Playwright against a real server; excluded by default (needs `playwright install chromium`), run via `make check-browser`",
]
