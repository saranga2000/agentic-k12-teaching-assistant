<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{% block title %}Answer keys{% endblock %}</title>
<style>
  body { font-family: sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1, h2 { margin-top: 0; }
  img.key-photo { max-width: 100%; max-height: 55vh; display: block; margin-bottom: 1rem; border: 1px solid #ccc; }
  .source-list { list-style: none; padding: 0; }
  .source-list li { margin-bottom: 0.5rem; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
  td, th { padding: 0.25rem; border-bottom: 1px solid #eee; text-align: left; }
  input[type=text], input[type=number] { width: 100%; box-sizing: border-box; }
  .actions { margin-top: 1rem; display: flex; gap: 0.5rem; }
  .message { background: #eef; padding: 0.75rem 1rem; border-radius: 4px; }
  button, .button-link { font-size: 1rem; padding: 0.5rem 1rem; }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
