<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{% block title %}Answer keys{% endblock %}</title>
<style>
  /* Same design system as k12ta.web/templates/base.html -- identical token names
     and values, not just a thematically-similar palette. This app is still
     desk-based and form-dense (a parent working through 30 answers, not a child's
     one-glance kiosk screen), so the layout differs -- a scrolling document with
     dense tables instead of a full-screen centred .screen -- but the colours,
     type, and glyph language are the one shared system across both apps. */
  :root {
    --bg: #12141a;
    --text: #f4f4f6;
    --text-dim: #b8bcc4;
    --surface: #1b1e26;
    --border: #2c2f38;
    --accent: #ffd166;
    --accent-active: #f2b705;
    --affirm: #4ecdc4;
    --affirm-bg: #1a3c30;
    --attention: #c98f5e;
    --attention-bg: #3a2a20;
    --neutral: #8b93a1;
    --neutral-bg: #262a33;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px; max-width: 960px; margin: 2rem auto; padding: 0 1.25rem;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  h1, h2 { margin-top: 0; }
  h1 { font-size: 1.6rem; } h2 { font-size: 1.2rem; color: var(--text-dim); font-weight: 600; }
  img.key-photo {
    max-width: 100%; max-height: 55vh; display: block; margin-bottom: 1rem;
    border: 1px solid var(--border); border-radius: 10px;
  }
  .source-list { list-style: none; padding: 0; }
  .source-list li { margin-bottom: 0.5rem; }
  .source-list a {
    display: inline-block; padding: 0.6rem 1rem; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    text-decoration: none;
  }
  table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
  td, th { padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border); text-align: left; }
  input[type=text], input[type=number] {
    width: 100%; box-sizing: border-box; padding: 0.35rem 0.5rem;
    border: 1px solid var(--border); border-radius: 6px; font-size: 1rem;
    background: var(--surface); color: var(--text);
  }
  fieldset { border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 1rem; }
  input.unconfirmed-field { border-color: var(--attention); background: var(--attention-bg); }
  .unconfirmed-flag {
    display: block; font-size: 0.8rem; color: var(--attention); margin-top: 0.25rem;
  }
  .identity-schema-editor {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.85rem 1.1rem; margin-bottom: 1rem;
  }
  .schema-component-row { display: block; margin: 0.4rem 0; }
  .schema-component-row input[type=text] { width: auto; display: inline-block; }
  .schema-example { color: var(--text-dim); font-size: 0.9rem; }
  .actions { margin-top: 1rem; display: flex; gap: 0.5rem; }
  /* Same fix, same reason as k12ta.web/templates/base.html: an author rule
     with equal specificity to the browser's default [hidden] rule always
     wins regardless of specificity, which silently defeated hidden="" on
     this app's own .working-state div too. See that file's comment for the
     live incident this was found from. */
  [hidden] { display: none !important; }
  .message {
    background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent);
    padding: 0.85rem 1.1rem; border-radius: 8px;
  }
  .message.attention {
    background: var(--attention-bg); border-color: var(--attention); border-left-color: var(--attention);
    font-weight: 600;
  }
  button, .button-link {
    font-size: 1rem; padding: 0.6rem 1.2rem; border-radius: 8px; border: none;
    background: var(--accent); color: #12141a; cursor: pointer;
    text-decoration: none; display: inline-block; font-weight: 600;
  }
  /* Same token names as k12ta.web/templates/base.html's working-state block --
     ported here for the same reason it was added there: a slow model call with no
     on-screen acknowledgement is indistinguishable from a stalled connection. */
  .working-state { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .working-state .message { margin: 0; }
  .working-detail { font-size: 1rem; color: var(--text-dim); margin: 0; }
  .working-spinner {
    width: 48px; height: 48px; border-radius: 50%;
    border: 5px solid var(--neutral-bg); border-top-color: var(--accent);
    animation: working-spin 0.8s linear infinite;
  }
  @keyframes working-spin { to { transform: rotate(360deg); } }
  /* Pending review, grouped by capture (2026-08-22) -- one photograph, its
     image, its items beneath, replacing a flat list grouped only by cause. */
  .capture-group {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 1rem 1.2rem; margin-bottom: 1.2rem;
  }
  .capture-group-header { margin-bottom: 0.6rem; }
  .capture-page { font-weight: 600; }
  .capture-group-images { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
  .capture-photo {
    max-width: 260px; max-height: 320px; border: 1px solid var(--border);
    border-radius: 8px; object-fit: contain;
  }
  /* A thumbnail next to her full-size photo, not equal billing -- the point is
     "does this key match what I'm looking at," a quick glance, not a second
     primary image. */
  .key-photo-thumb { max-width: 180px; max-height: 220px; }
  .pending-list { list-style: none; padding: 0; margin: 0; }
  .pending-list li { padding: 0.4rem 0; border-top: 1px solid var(--border); }
  .pending-list li:first-child { border-top: none; }
  .cause-label {
    display: inline-block; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--text-dim); background: var(--neutral-bg); border-radius: 6px;
    padding: 0.1rem 0.5rem; margin-right: 0.5rem;
  }
  /* The parent-side ask-and-confirm flow (2026-08-22 M3.9) -- same shape as
     k12ta.web/templates/session_result.html's student-side version. */
  .page-entry-ask { display: flex; gap: 0.5rem; margin-top: 0.6rem; align-items: center; }
  .page-entry-ask input[type=number] { width: 8rem; }
  .entry-preview-list { list-style: none; padding: 0; margin: 0.4rem 0 0; }
  .entry-preview-list li { padding: 0.15rem 0; }
  /* The two-second summary (2026-08-22 M3.9): five counts, each a jump to
     its own real section -- see docs/ROADMAP.md. */
  .summary-bar {
    list-style: none; padding: 0; margin: 0 0 1.2rem; display: flex; flex-wrap: wrap; gap: 1rem;
  }
  .summary-bar li {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.5rem 0.9rem;
  }
  .summary-bar strong { font-size: 1.15rem; }
  .summary-bar a { color: var(--text); text-decoration: none; }
  .summary-bar a:hover { text-decoration: underline; }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
