<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{% block title %}Answer keys{% endblock %}</title>
<style>
  /* Same design system as k12ta.web/templates/base.html -- identical token names
     and values, not just a thematically-similar palette. This app is still
     desk-based and form-dense (a parent working through 30 answers, not a child's
     one-glance kiosk screen), so the layout differs -- a scrolling document with
     dense tables instead of a full-screen centred .screen -- but the colours,
     type, and glyph language are the one shared system across both apps. */
  :root {
    --bg: #12141a;
    --text: #f4f4f6;
    --text-dim: #b8bcc4;
    --surface: #1b1e26;
    --border: #2c2f38;
    --accent: #ffd166;
    --accent-active: #f2b705;
    --affirm: #4ecdc4;
    --affirm-bg: #1a3c30;
    --attention: #c98f5e;
    --attention-bg: #3a2a20;
    --neutral: #8b93a1;
    --neutral-bg: #262a33;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px; max-width: 960px; margin: 2rem auto; padding: 0 1.25rem;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  h1, h2 { margin-top: 0; }
  h1 { font-size: 1.6rem; } h2 { font-size: 1.2rem; color: var(--text-dim); font-weight: 600; }
  img.key-photo {
    max-width: 100%; max-height: 55vh; display: block; margin-bottom: 1rem;
    border: 1px solid var(--border); border-radius: 10px;
  }
  .source-list { list-style: none; padding: 0; }
  .source-list li { margin-bottom: 0.5rem; }
  .source-list a {
    display: inline-block; padding: 0.6rem 1rem; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    text-decoration: none;
  }
  table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
  td, th { padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border); text-align: left; }
  input[type=text], input[type=number] {
    width: 100%; box-sizing: border-box; padding: 0.35rem 0.5rem;
    border: 1px solid var(--border); border-radius: 6px; font-size: 1rem;
    background: var(--surface); color: var(--text);
  }
  fieldset { border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 1rem; }
  input.unconfirmed-field { border-color: var(--attention); background: var(--attention-bg); }
  .unconfirmed-flag {
    display: block; font-size: 0.8rem; color: var(--attention); margin-top: 0.25rem;
  }
  .actions { margin-top: 1rem; display: flex; gap: 0.5rem; }
  .message {
    background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent);
    padding: 0.85rem 1.1rem; border-radius: 8px;
  }
  button, .button-link {
    font-size: 1rem; padding: 0.6rem 1.2rem; border-radius: 8px; border: none;
    background: var(--accent); color: #12141a; cursor: pointer;
    text-decoration: none; display: inline-block; font-weight: 600;
  }
  /* Same token names as k12ta.web/templates/base.html's working-state block --
     ported here for the same reason it was added there: a slow model call with no
     on-screen acknowledgement is indistinguishable from a stalled connection. */
  .working-state { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .working-state .message { margin: 0; }
  .working-detail { font-size: 1rem; color: var(--text-dim); margin: 0; }
  .working-spinner {
    width: 48px; height: 48px; border-radius: 50%;
    border: 5px solid var(--neutral-bg); border-top-color: var(--accent);
    animation: working-spin 0.8s linear infinite;
  }
  @keyframes working-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
