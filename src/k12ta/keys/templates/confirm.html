{% extends "base.html" %}
{% block title %}Confirm — {{ source.label }}{% endblock %}
{% block content %}
<h1>Confirm — {{ source.label }} — {{ student.display_name }}</h1>
<img class="key-photo" src="{{ photo_data_uri }}" alt="Scanned key page">

<form method="post" action="/keys/{{ student.student_id }}/{{ source.source_id }}/confirm">
  <input type="hidden" name="row_count" value="{{ entries|length }}">
  <table>
    <tr>
      <th>page</th><th>problem</th><th>answer</th><th>ungradeable</th><th>reason</th>
    </tr>
    {% for entry in entries %}
    <tr>
      <td><input type="text" name="page_number_{{ loop.index0 }}" value="{{ entry.page_number }}"></td>
      <td><input type="text" name="problem_number_{{ loop.index0 }}" value="{{ entry.problem_number }}"></td>
      <td><input type="text" name="answer_text_{{ loop.index0 }}" value="{{ entry.answer_text or '' }}"></td>
      <td>
        <input
          type="checkbox"
          name="ungradeable_{{ loop.index0 }}"
          value="1"
          class="ungradeable-checkbox"
          data-reason-field="ungradeable_reason_{{ loop.index0 }}"
          {% if entry.ungradeable_reason %}checked{% endif %}
        >
      </td>
      <td>
        <select name="ungradeable_reason_{{ loop.index0 }}" id="ungradeable_reason_{{ loop.index0 }}">
          {% for reason in ungradeable_reasons %}
          <option value="{{ reason }}" {% if entry.ungradeable_reason == reason %}selected{% endif %}>{{ reason }}</option>
          {% endfor %}
        </select>
      </td>
    </tr>
    {% endfor %}
  </table>
  <div class="actions">
    <button type="submit">Save (Enter)</button>
  </div>
</form>

<script>
  const form = document.querySelector("form");

  function visibleFields() {
    return Array.from(form.querySelectorAll("input[type=text], select"))
      .filter((el) => el.offsetParent !== null);
  }
  form.querySelectorAll("input[type=text], select").forEach((field) => {
    field.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      const fields = visibleFields();
      const i = fields.indexOf(field);
      if (i >= 0 && i < fields.length - 1) {
        event.preventDefault();
        fields[i + 1].focus();
      }
    });
  });
  const first = visibleFields()[0];
  if (first) {
    first.focus();
  }
</script>
{% endblock %}
