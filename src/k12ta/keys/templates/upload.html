{% extends "base.html" %}
{% block title %}Scan {{ source.label }}{% endblock %}
{% block content %}
<h1>{{ source.label }} — {{ student.display_name }}</h1>
<p>Photograph or choose a page of the answer key. One photo can cover several
workbook pages, so a whole key is usually 6-8 photos.</p>
<form method="post" action="/keys/{{ student.student_id }}/{{ source.source_id }}/upload" enctype="multipart/form-data">
  <input type="file" name="photo" accept="image/*" capture="environment" required>
  <div class="actions">
    <button type="submit">Upload page</button>
  </div>
</form>
{% endblock %}
