<!-- M9b (docs/ROADMAP.md): shared by capture.html and result.html's retake
     form in k12ta.web, and by k12ta.keys' upload.html -- two ways to get a
     photo into the same target file input (`input_id`), so every caller's
     existing submit logic (either _capture_checklist.html's
     auto-submit-on-change, or keys/upload.html's own explicit-button submit)
     needs no changes at all:

     - "Take Photo": a live in-page camera (getUserMedia) when the browser
       will allow it -- true on http://localhost (secure-context exempt) and
       on HTTPS, false on the plain-HTTP .local LAN address this app is
       actually deployed on (docs/DEPLOYMENT.md). Falls back to the native
       `capture="environment"` file input either way, which is what already
       works correctly on the iPad/iPhone per that same doc -- nothing
       regresses there.
     - "Upload a Photo": a second file input with no `capture` attribute, so
       it opens the ordinary file/photo browser on every platform, MacBook
       included. This is the durable fix; the camera above is a best-effort
       enhancement layered on top of it, never a replacement for it.

     Used to be two near-identical copies, one per app, differing only in
     button sizing: k12ta.web is a child's one-glance kiosk screen (large,
     full-width, stacked buttons), k12ta.keys is a parent's dense desk-based
     form (plain buttons styled by that app's own `button` rule, laid out in
     a row). Reached from both apps via the same design/ Jinja2Templates
     fallback search path as _lightbox.html (see k12ta.web.app /
     k12ta.keys.app) -- one physical file, the sizing difference expressed as
     a parameter rather than as drift between two copies.

     Parameters: input_id (the target file input other scripts already look
     for), button_wrapper_id (default "take-photo-button" -- the id
     _capture_checklist.html hides on submit; keys/upload.html doesn't use
     this id but having it costs nothing there), primary_label (default
     "Take Photo"), hide_camera (default false -- an online-exercise
     screenshot has no physical page to photograph, so only Upload makes
     sense there), large (default true -- pass false for the parent app's
     compact, plain-button treatment). -->
{% set large = large is not defined or large %}
<div id="{{ button_wrapper_id | default('take-photo-button') }}" class="photo-source-picker{{ '' if large else ' photo-source-picker--compact' }}">
  {% if not hide_camera %}
  <button type="button" class="{{ 'big-button' if large }}" id="{{ input_id }}-camera-btn">{{ primary_label | default("Take Photo") }}</button>
  {% endif %}
  <button type="button" class="{{ 'big-button secondary' if large }}" id="{{ input_id }}-upload-btn">{{ "Add Screenshot" if hide_camera else "Upload a Photo" }}</button>
</div>
<input id="{{ input_id }}" type="file" name="photo" accept="image/*" capture="environment" style="display:none">
<input id="{{ input_id }}-upload-proxy" type="file" accept="image/*" style="display:none">
<p id="{{ input_id }}-camera-error" class="message" hidden>Couldn't reach the camera &mdash; use "Upload a Photo" instead.</p>
<div id="{{ input_id }}-camera-modal" class="camera-modal" hidden>
  <video id="{{ input_id }}-camera-video" autoplay playsinline></video>
  <div class="camera-modal-actions">
    <button type="button" class="{{ 'big-button' if large }}" id="{{ input_id }}-camera-capture">Capture</button>
    <button type="button" class="{{ 'big-button secondary' if large }}" id="{{ input_id }}-camera-cancel">Cancel</button>
  </div>
</div>
<script>
  (function () {
    var targetInput = document.getElementById("{{ input_id }}");
    var uploadProxy = document.getElementById("{{ input_id }}-upload-proxy");
    var cameraBtn = document.getElementById("{{ input_id }}-camera-btn");
    var uploadBtn = document.getElementById("{{ input_id }}-upload-btn");
    var cameraError = document.getElementById("{{ input_id }}-camera-error");
    var modal = document.getElementById("{{ input_id }}-camera-modal");
    var video = document.getElementById("{{ input_id }}-camera-video");
    var captureBtn = document.getElementById("{{ input_id }}-camera-capture");
    var cancelBtn = document.getElementById("{{ input_id }}-camera-cancel");
    var stream = null;

    // Moves one File onto the target input and fires "change" on it, so
    // whichever submit logic the including page already wired up (auto-
    // submit-on-change, or an explicit button click later) sees it exactly
    // as if the user had picked it from that input directly.
    function deliver(file) {
      var dt = new DataTransfer();
      dt.items.add(file);
      targetInput.files = dt.files;
      targetInput.dispatchEvent(new Event("change", { bubbles: true }));
    }

    function stopStream() {
      if (stream) {
        stream.getTracks().forEach(function (track) { track.stop(); });
        stream = null;
      }
    }

    function closeModal() {
      stopStream();
      modal.hidden = true;
    }

    if (uploadProxy) {
      uploadProxy.addEventListener("change", function () {
        if (uploadProxy.files && uploadProxy.files.length) {
          deliver(uploadProxy.files[0]);
        }
      });
    }
    if (uploadBtn) {
      uploadBtn.addEventListener("click", function () { uploadProxy.click(); });
    }

    if (cameraBtn) {
      cameraBtn.addEventListener("click", function () {
        cameraError.hidden = true;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          targetInput.click();
          return;
        }
        navigator.mediaDevices
          .getUserMedia({ video: { facingMode: { ideal: "environment" } } })
          .then(function (s) {
            stream = s;
            video.srcObject = s;
            modal.hidden = false;
          })
          .catch(function () {
            // Insecure context (the real .local deployment), permission
            // denied, or no camera -- fall back to the native capture input
            // rather than leaving the tap looking like it did nothing.
            targetInput.click();
          });
      });
      captureBtn.addEventListener("click", function () {
        var canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(
          function (blob) {
            if (blob) {
              deliver(new File([blob], "capture.jpg", { type: "image/jpeg" }));
            }
            closeModal();
          },
          "image/jpeg",
          0.92
        );
      });
      cancelBtn.addEventListener("click", closeModal);
    }
  })();
</script>
<style>
  .photo-source-picker { display: flex; flex-direction: column; gap: 0.9rem; width: 100%; max-width: 560px; }
  .photo-source-picker--compact { flex-direction: row; gap: 0.6rem; width: auto; max-width: none; }
  .camera-modal {
    position: fixed; inset: 0; background: #000; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem;
  }
  .camera-modal video { max-width: 100%; max-height: 75vh; }
  .camera-modal-actions { display: flex; gap: 1rem; width: 100%; max-width: 480px; padding: 0 1.5rem; }
  .camera-modal-actions .big-button { padding: 1rem 1.5rem; font-size: 1.3rem; }
</style>
