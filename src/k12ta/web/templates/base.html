<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!--
  Deliberately not apple-mobile-web-app-capable: that's what "Add to Home Screen"
  needs to launch standalone with no browser chrome, and standalone mode is where a
  real-device test found `input[type=file][capture]` opening the camera unreliable
  (a blank black screen, no way to take a photo) -- a known WebKit bug in that launch
  mode. This app is meant to run as an ordinary browser tab. See docs/DEPLOYMENT.md.
-->
<script src="/static/theme-init.js"></script>
<title>{% block title %}Capture{% endblock %}</title>
<link rel="stylesheet" href="/static/tokens.css">
<style>
  /* App-specific layout only -- tokens, the lightbox, the working-spinner
     keyframes, [hidden], and the base reset all live in the shared
     /static/tokens.css now (M9a, docs/ROADMAP.md). What stays here is
     genuinely specific to this app: a full-viewport, centred kiosk screen for
     a child on a tablet, never the parent app's scrolling document layout. */
  html, body {
    height: 100%; margin: 0; padding: 0;
    font-family: var(--font-body);
    font-size: 18px;
    background: var(--bg); color: var(--text);
    overscroll-behavior: none; user-select: none;
  }
  body {
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  * { -webkit-tap-highlight-color: transparent; }
  .screen {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: var(--space-5); padding: var(--space-5); text-align: center;
  }
  .big-button {
    display: block; width: 100%; max-width: 560px;
    padding: var(--space-6) var(--space-5); font-size: var(--text-2xl); font-weight: 600;
    color: var(--accent-ink); background: var(--accent); border: none; border-radius: var(--radius-xl);
    text-decoration: none; cursor: pointer;
  }
  .big-button:active { background: var(--accent-active); }
  .big-button.secondary { background: var(--affirm); }
  p.message { max-width: 32rem; }
  /* The checklist that replaced the single opaque "Checking your page..."
     spinner -- so a stopped or failed request shows exactly which step it
     got to, not just "still waiting" indefinitely. See k12ta.web.app.
     _stream_capture_response's docstring for the protocol driving this. */
  .checklist {
    display: flex; flex-direction: column; gap: 0.6rem; align-items: flex-start;
    width: 100%; max-width: 22rem;
  }
  .checklist-item {
    display: flex; align-items: center; gap: 0.75rem;
    font-size: 1.15rem; color: var(--text-dim);
  }
  .checklist-item.done { color: var(--text); }
  .checklist-item.active { color: var(--text); }
  .checklist-item.failed { color: var(--attention); font-weight: 600; }
  .checklist-glyph {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.4rem; height: 1.4rem; flex-shrink: 0; font-weight: 700;
  }
  .checklist-item.done .checklist-glyph::before { content: "✓"; color: var(--affirm); }
  .checklist-item.failed .checklist-glyph::before { content: "✗"; color: var(--attention); }
  .checklist-item.active .checklist-glyph {
    border-radius: 50%; border: 3px solid var(--neutral-bg); border-top-color: var(--accent);
    animation: working-spin 0.8s linear infinite;
  }
  .checklist-item:not(.done):not(.active):not(.failed) .checklist-glyph::before {
    content: "○"; color: var(--neutral);
  }
  /* working-spin's @keyframes, the lightbox's CSS, and [hidden] all now live
     in the shared /static/tokens.css (M9a) -- this app's own markup/script for
     the lightbox stays below, since only the stylesheet was in scope for this
     pass, not a shared JS asset too. */
</style>
</head>
<body>
{% include "_theme_toggle.html" %}
{% block content %}{% endblock %}
{% include "_lightbox.html" %}
</body>
</html>
