<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!--
  Deliberately not apple-mobile-web-app-capable: that's what "Add to Home Screen"
  needs to launch standalone with no browser chrome, and standalone mode is where a
  real-device test found `input[type=file][capture]` opening the camera unreliable
  (a blank black screen, no way to take a photo) -- a known WebKit bug in that launch
  mode. This app is meant to run as an ordinary browser tab. See docs/DEPLOYMENT.md.
-->
<title>{% block title %}Capture{% endblock %}</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #12141a; color: #f4f4f6;
    overscroll-behavior: none; user-select: none;
  }
  body {
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1.5rem; padding: 1.5rem; text-align: center;
  }
  .big-button {
    display: block; width: 100%; max-width: 560px;
    padding: 2rem 1.5rem; font-size: 2rem; font-weight: 600;
    color: #12141a; background: #ffd166; border: none; border-radius: 20px;
    text-decoration: none; cursor: pointer;
  }
  .big-button:active { background: #f2b705; }
  .big-button.secondary { background: #4ecdc4; }
  p.message { font-size: 1.4rem; line-height: 1.4; max-width: 32rem; }
  .working-state { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .working-state .message { margin: 0; }
  .working-detail { font-size: 1rem; opacity: 0.75; margin: 0; }
  .working-spinner {
    width: 48px; height: 48px; border-radius: 50%;
    border: 5px solid #262a33; border-top-color: #ffd166;
    animation: working-spin 0.8s linear infinite;
  }
  @keyframes working-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
