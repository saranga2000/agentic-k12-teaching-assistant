<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!--
  Deliberately not apple-mobile-web-app-capable: that's what "Add to Home Screen"
  needs to launch standalone with no browser chrome, and standalone mode is where a
  real-device test found `input[type=file][capture]` opening the camera unreliable
  (a blank black screen, no way to take a photo) -- a known WebKit bug in that launch
  mode. This app is meant to run as an ordinary browser tab. See docs/DEPLOYMENT.md.
-->
<title>{% block title %}Capture{% endblock %}</title>
<style>
  :root {
    /* One palette, shared by every screen in this app: an affirmative family (calm
       teal, not a scoreboard green), an attention family (muted amber-brown, never
       alarm red), and a neutral family for "come back to this one, it's not a
       verdict." Colour is always the third signal here, after a distinct glyph and
       an explicit label -- see the results page and the capture framing guide,
       which both draw from the same three families. */
    --bg: #12141a;
    --text: #f4f4f6;
    --text-dim: #b8bcc4;
    --surface: #1b1e26;
    --accent: #ffd166;
    --accent-active: #f2b705;
    --affirm: #4ecdc4;
    --affirm-bg: #1a3c30;
    --attention: #c98f5e;
    --attention-bg: #3a2a20;
    --neutral: #8b93a1;
    --neutral-bg: #262a33;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 18px;
    background: var(--bg); color: var(--text);
    overscroll-behavior: none; user-select: none;
  }
  body {
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1.5rem; padding: 1.5rem; text-align: center;
  }
  .big-button {
    display: block; width: 100%; max-width: 560px;
    padding: 2rem 1.5rem; font-size: 1.75rem; font-weight: 600;
    color: #12141a; background: var(--accent); border: none; border-radius: 20px;
    text-decoration: none; cursor: pointer;
  }
  .big-button:active { background: var(--accent-active); }
  .big-button.secondary { background: var(--affirm); }
  p.message { font-size: 1.25rem; line-height: 1.5; max-width: 32rem; }
  /* [hidden] must win over any class rule below, always -- a live bug found
     this the hard way: .working-state's own display:flex has equal CSS
     specificity to the browser's default [hidden] rule, and author rules
     always beat the user-agent stylesheet regardless of specificity, so
     hidden="" was silently doing nothing for this element. A rejected photo
     showed the reject message and a "Checking your page..." spinner at the
     same time, and the spinner never stopped, because nothing was ever
     going to: it was never hidden in the first place. */
  [hidden] { display: none !important; }
  /* The checklist that replaced the single opaque "Checking your page..."
     spinner -- so a stopped or failed request shows exactly which step it
     got to, not just "still waiting" indefinitely. See k12ta.web.app.
     _stream_capture_response's docstring for the protocol driving this. */
  .checklist {
    display: flex; flex-direction: column; gap: 0.6rem; align-items: flex-start;
    width: 100%; max-width: 22rem;
  }
  .checklist-item {
    display: flex; align-items: center; gap: 0.75rem;
    font-size: 1.15rem; color: var(--text-dim);
  }
  .checklist-item.done { color: var(--text); }
  .checklist-item.active { color: var(--text); }
  .checklist-item.failed { color: var(--attention); font-weight: 600; }
  .checklist-glyph {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.4rem; height: 1.4rem; flex-shrink: 0; font-weight: 700;
  }
  .checklist-item.done .checklist-glyph::before { content: "✓"; color: var(--affirm); }
  .checklist-item.failed .checklist-glyph::before { content: "✗"; color: var(--attention); }
  .checklist-item.active .checklist-glyph {
    border-radius: 50%; border: 3px solid var(--neutral-bg); border-top-color: var(--accent);
    animation: working-spin 0.8s linear infinite;
  }
  .checklist-item:not(.done):not(.active):not(.failed) .checklist-glyph::before {
    content: "○"; color: var(--neutral);
  }
  @keyframes working-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
