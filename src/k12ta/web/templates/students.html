{% extends "base.html" %}
{% block title %}Who's working?{% endblock %}
{% block content %}
<div class="screen">
  {% for student in all_students %}
  <a class="big-button" href="/student/{{ student.student_id }}">{{ student.display_name }}</a>
  {% else %}
  <p class="message">{{ no_students_message }}</p>
  {% endfor %}
</div>
{% endblock %}
